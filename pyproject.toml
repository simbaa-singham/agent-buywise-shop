[project]
name = "agent-buywise-shop"
version = "0.1.0"
description = "An AI shopping assistant that helps customers choose, order and track electronic devices."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "langchain-ollama",
    "mcp",
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "chromadb",
    "opentelemetry-sdk",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
