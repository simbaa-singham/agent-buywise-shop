[project]
name = "agent-buywise-shop"
version = "0.1.0"
description = "An AI shopping assistant that helps customers choose, order and track electronic devices."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "langchain-openai",
    "mcp",
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "pgvector",
    "opentelemetry-sdk",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "jsonschema",
    "datamodel-code-generator",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
extend-exclude = ["buywise_agent/contracts/chat_contract.py"]
