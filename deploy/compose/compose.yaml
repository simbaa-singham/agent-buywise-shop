# Local-dev stack (deploy/docs/design.md local-dev; phase 0). Run only what a task needs (deploy/docs/design.md 4b).
# Ollama runs on the host (not in Docker) and is reached only through LiteLLM (ADR-026).
# Run via make: `make up` (start + wait until healthy), `make ps`, `make logs`, `make down` (stop, data kept), `make migrate`.
# ${NAME} values come from deploy/compose/.env (git-ignored; template: .env.example).
# Inside Docker, containers reach each other by service name (postgres:5432); from the Mac use localhost:<port>.
name: buywise                     # project name: containers are called buywise-postgres-1, buywise-redis-1, ...

services:                         # one entry per container
  postgres:
    # One cluster, one database per deployable (ADR-010); pgvector for RAG (ADR-011)
    image: pgvector/pgvector:pg17                       # Postgres 17 with the pgvector extension included
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}           # admin (postgres) user password
      SERVICES_DB_PASSWORD: ${SERVICES_DB_PASSWORD}     # the 4 app-user passwords: passed in only so the
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD}           #   init script (buywise-db/cluster/01-databases.sh)
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}     #   can create one user per database
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD}
    ports: ["5432:5432"]                                # Mac port : container port -> apps use localhost:5432
    volumes:
      # PG_DATA_DIR set in .env -> data in that folder on the host (bind mount); unset -> Docker volume "pgdata"
      - ${PG_DATA_DIR:-pgdata}:/var/lib/postgresql/data # Postgres data files; survive `make down`
      - ../../buywise-db/cluster:/docker-entrypoint-initdb.d:ro  # setup scripts, run ONLY on first start (empty data folder); :ro = read-only
    healthcheck:                                        # how Docker knows Postgres is ready, not just started
      test: ["CMD-SHELL", "pg_isready -U postgres"]     # "are you accepting connections?"
      interval: 5s                                      # check every 5 s
      retries: 20                                       # unhealthy after 20 failed checks (~100 s)

  redis:
    # Sessions, conversation streams, budget counters, rate limits (ADR-021/026/029/032)
    image: redis:7.4-alpine                             # small Linux base image (alpine)
    ports: ["6379:6379"]                                # apps use localhost:6379
    # No volume on purpose: Redis holds only short-lived data; losing it is acceptable (ADR-035)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]                # healthy when it answers PONG
      interval: 5s
      retries: 20

  keycloak:
    # Realm as code; clients and roles stubbed in phase 0, users and token exchange in phase 2 (ADR-021/028)
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]            # dev mode (plain HTTP, relaxed hostname checks) + load the realm file
    environment:
      KC_DB: postgres                                   # store Keycloak's own data in Postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak  # "postgres" = the container name; its own database
      KC_DB_USERNAME: keycloak                          # its own user (can open only the keycloak database)
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin                # admin console login at http://localhost:8080
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"                         # turns on /health/ready on management port 9000
    ports: ["8080:8080"]                                # login pages + admin console
    volumes:
      - ./keycloak/buywise-realm.json:/opt/keycloak/data/import/buywise-realm.json:ro  # realm (clients, roles) as code
    healthcheck:
      # The image has no curl; bash sends a raw HTTP request to the readiness endpoint on the management port 9000
      # and the check passes when the reply contains "status": "UP"
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s                                       # one check may take at most 5 s
      retries: 30
      start_period: 20s                                 # boot time: failures in the first 20 s do not count
    depends_on:
      postgres: {condition: service_healthy}            # start only after Postgres passes its health check

  litellm:
    # Model gateway: every model call goes through here (ADR-026, ADR-040)
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]  # model names + prices from config.yaml
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}         # key the agent must send; no key, no model call
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm  # spend records, own database
      OLLAMA_API_BASE: http://host.docker.internal:11434  # Ollama running on the Mac
    extra_hosts: ["host.docker.internal:host-gateway"]  # makes host.docker.internal point to the Mac
    ports: ["4000:4000"]                                # agent calls localhost:4000 (OpenAI-style API)
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro       # buywise-primary / buywise-economy / bge-m3 -> real models
    healthcheck:
      # The image has Python; call LiteLLM's liveness endpoint
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      postgres: {condition: service_healthy}

  flyway:
    # Applies buywise-services schema migrations (seed Option B: schema first, then the seed job)
    image: flyway/flyway:11
    profiles: ["tools"]                                 # not started by `make up`; only by `make migrate` / `make flyway-info`
    command: ["migrate"]                                # apply pending migrations, then exit (run with --rm: container removed)
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/services  # only the services database
      FLYWAY_USER: services
      FLYWAY_PASSWORD: ${SERVICES_DB_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql          # where the SQL files are inside the container (see volume)
      FLYWAY_CREATE_SCHEMAS: "true"                     # create the flyway schema if missing
      FLYWAY_DEFAULT_SCHEMA: flyway                     # history table: flyway.flyway_schema_history
    volumes:
      - ../../buywise-db/services/migrations:/flyway/sql:ro  # same V1..Vn files the Java app applies (ADR-046)
    depends_on:
      postgres: {condition: service_healthy}

  flyway-agent:
    # Applies buywise-agent schema migrations (rag.chunks) to the agent database (ADR-046)
    image: flyway/flyway:11
    profiles: ["tools"]                                 # not started by `make up`; only by `make migrate` / `make flyway-info`
    command: ["migrate"]
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/agent # only the agent database
      FLYWAY_USER: agent
      FLYWAY_PASSWORD: ${AGENT_DB_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CREATE_SCHEMAS: "true"
      FLYWAY_DEFAULT_SCHEMA: flyway                     # history table: flyway.flyway_schema_history (in agent)
    volumes:
      - ../../buywise-db/agent/migrations:/flyway/sql:ro
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  pgdata:                         # fallback Docker volume, used only when PG_DATA_DIR is not set
