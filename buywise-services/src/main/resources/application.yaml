server:
  port: 8081
spring:
  application:
    name: buywise-services
  datasource:
    url: jdbc:postgresql://localhost:5432/services
    username: services
    password: ${SERVICES_DB_PASSWORD:services-local}
  flyway:
    default-schema: flyway
    create-schemas: true
  jackson:
    default-property-inclusion: non_null
buywise:
  security:                                  # ADR-050: tokens from this issuer, for this audience
    issuer: ${BUYWISE_SECURITY_ISSUER:http://localhost:8080/realms/buywise}
    jwks-uri: ${BUYWISE_SECURITY_JWKS_URI:}  # empty = issuer + /protocol/openid-connect/certs
    audience: buywise-services
management:
  endpoints:
    web:
      exposure:
        include: health
---
spring.mvc.problemdetails.enabled: true
server.error.include-message: always
