[project]
name = "buywise-mcp"
version = "0.1.0"
description = "MCP tool servers wrapping the buywise-services REST APIs (ADR-015, ADR-031)."
requires-python = ">=3.12"
dependencies = [
    "mcp",
    "httpx",
    "uvicorn",
    "starlette",
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest",
    "ruff",
    "testcontainers>=4.15.0",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]                     # import buywise_mcp from the project folder
# Integration tests start containers (Postgres + buywise-services); run them with make test-integration
addopts = "-m 'not integration'"
markers = ["integration: needs Docker; starts Postgres and buywise-services in containers"]
